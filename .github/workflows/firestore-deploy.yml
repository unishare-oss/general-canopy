name: Deploy Firestore & Storage

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firestore-deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-firestore-storage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Rules, Indexes & Storage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore & Storage rules and indexes
        run: firebase deploy --only firestore,storage --project canopy-30d09
